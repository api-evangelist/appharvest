name: AppHarvest
description: 'AppHarvest is an American agriculture technology company that builds large‑scale indoor farms using hydroponic vertical farming methods. Founded in 2017, it aims to produce pesticide‑free, sustainably grown produce year‑round, reducing water usage and transportation emissions. The company operates commercial farms in Kentucky and other locations, supplying fresh vegetables to grocery retailers and food service operators.'
